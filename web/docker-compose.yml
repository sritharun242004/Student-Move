version: "3.8"
services:  
  postgres:
      container_name: container-pg
      image: postgres:17.4
      hostname: postgres
      env_file:
        - backend/.env
      environment:
        DB_NAME: ${DB_NAME:-mooc}
        DB_USER: ${DB_USER:-moocuser}
        DB_PASSWORD: ${DB_PASSWORD}
      volumes:
        - postgres-data:/var/lib/postgresql/data
      restart: always
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-moocuser} -d ${DB_NAME:-mooc}"]
        interval: 5s
        timeout: 5s
        retries: 5
      networks:
        - studentmoves-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: django-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DB_NAME: ${DB_NAME:-mooc}
      DB_USER: ${DB_USER:-moocuser}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
            gunicorn studentmove.wsgi:application --bind 0.0.0.0:8000"
    restart: always
    networks:
      - studentmoves-network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: always
    networks:
      - studentmoves-network

volumes:
  postgres-data:

networks:
  studentmoves-network:
    external: true